<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Ultra Pog Animated Tetris</title>
    <base href="../_data/">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Micro+5&display=swap');

        body {
            margin: 0;
            background: #10141a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            font-family: 'Micro 5', sans-serif;
        }

        canvas {
            image-rendering: pixelated;
            background: rgba(50, 55, 60, 0.5);
            outline: 4px solid #fff;
            box-shadow:
                0 10px 24px rgba(0, 0, 0, 0.5),
                inset 0 0 50px 20px rgba(0, 0, 0, 0.2);
            border-radius: 4px;
            z-index: 1;
        }

        #ui {
            position: absolute;
            top: 50vh;
            left: calc(50vw + 300px);
            transform: translate(-50%, -50%);
            background: rgba(50, 55, 60, 0.5);
            padding: 0 16px;
            color: #fff;
            z-index: 10;
            width: 180px;
            outline: 3px solid #aaa;
            box-shadow:
                0 10px 24px rgba(0, 0, 0, 0.5),
                inset 0 0 50px 20px rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .ui-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            line-height: 1.2rem;
            font-size: 20px;
            width: 100%;
        }

        .ui-title {
            font-size: 32px;
            color: #aaa;
            line-height: 1.7rem;
            text-align: center;
        }

        .ui-value {
            font-size: 32px;
            font-weight: bold;
            line-height: 1.7rem;
            text-align: center;
        }

        #next {
            margin-top: 8px;
            padding: 8px;
            border-radius: 16px;
        }

        #devMode {
            display: none;
            width: 100%;
            margin: 2px 0 10px;
            padding: 5px 0;
            text-align: center;
            font-size: 22px;
            color: #fff;
            background: rgba(255, 190, 50, 0.2);
            border: 2px solid rgba(255, 210, 80, 0.7);
            border-radius: 6px;
            box-sizing: border-box;
        }

        #devMode.active {
            display: block;
        }

        #pauseBtn {
            margin: 12px 0 16px;
            width: 100%;
            padding: 8px;
            font-family: 'Micro 5', sans-serif;
            font-size: 24px;
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.35);
            border-radius: 8px;
            cursor: pointer;
        }

        #pauseBtn:hover {
            background: rgba(255, 255, 255, 0.18);
        }

        #pauseBtn:active {
            transform: scale(0.96);
        }

        #highScoreUI {
            position: absolute;
            top: 50vh;
            right: calc(50vw + 300px);
            transform: translate(50%, -50%);
            background: rgba(50, 55, 60, 0.5);
            padding: 14px 16px;
            color: #fff;
            z-index: 10;
            width: 180px;
            outline: 3px solid #aaa;
            box-shadow:
                0 10px 24px rgba(0, 0, 0, 0.5),
                inset 0 0 50px 20px rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        /* #highScoreUI .ui-title {
            width: 100%;
            text-align: center;
        }

        #highScore {
            margin-top: 4px;
        } */
    </style>
</head>

<body>
    <div id="highScoreUI">
        <div class="ui-value" style="margin-bottom: 16px;">HIGH SCORE:</div>

        <div class="ui-line">
            <span class="ui-title">SCORE:</span>
            <div id="highScore" class="ui-value">0</div>
        </div>

        <div class="ui-line">
            <span class="ui-title">TIME:</span>
            <span id="highScoreTime" class="ui-value">00:00</span>
        </div>

        <div class="ui-line">
            <span class="ui-title">LINES:</span>
            <span id="highScoreLines" class="ui-value">0</span>
        </div>

        <div class="ui-line">
            <span class="ui-title">LEVEL:</span>
            <span id="highScoreLevel" class="ui-value">0</span>
        </div>
    </div>
    <div id="ui">

        <div style="margin: 16px 0 20px 0">
            <div class="ui-value">NEXT UP:</div>
            <canvas id="next" width="96" height="96"></canvas>
        </div>

        <div id="devMode">DEV: I-ONLY</div>

        <div class="ui-line">
            <span class="ui-title">SCORE:</span>
            <span id="score" class="ui-value">0</span>
        </div>

        <div class="ui-line">
            <span class="ui-title">TIME:</span>
            <span id="time" class="ui-value">00:00</span>
        </div>

        <div class="ui-line">
            <span class="ui-title">LINES:</span>
            <span id="lines" class="ui-value">0</span>
        </div>

        <div class="ui-line">
            <span class="ui-title">LEVEL:</span>
            <span id="level" class="ui-value">0</span>
        </div>

        <button id="pauseBtn">PAUSE</button>
    </div>

    <canvas id="game" width="320" height="640"></canvas>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');

        const COLS = 10;
        const ROWS = 20;
        const BLOCK = 32;

        const COLORS = [
            null,
            '#ff3838',
            '#ffb8b8',
            '#38ff83',
            '#83ffb8',
            '#3838ff',
            '#b838ff',
            '#ffb838'
        ];

        let score = 0;
        let linesCleared = 0;
        let level = 0;

        let highScoreData = JSON.parse(
            localStorage.getItem("tetrisHighScoreData") ||
            '{"score":0,"time":0,"lines":0,"level":0}'
        );

        // make sure old saves that don't have the newer fields still work
        highScoreData = {
            score: Number(highScoreData.score) || 0,
            time: Number(highScoreData.time) || 0,
            lines: Number(highScoreData.lines) || 0,
            level: Number(highScoreData.level) || 0
        };

        let highScore = highScoreData.score;
        let newHighScoreThisGame = false;

        // level-up border shine
        let levelUpShine = 0;
        const LEVEL_UP_SHINE_DURATION = 700;

        let startTime = Date.now();
        let pausedAt = null;

        let gameOver = false;
        let paused = false;

        const MAX_GRAVITY = 50;
        const START_GRAVITY = 800;

        let gravityTimer = 0;

        const scoreEl = document.getElementById('score');
        const linesEl = document.getElementById('lines');
        const timeEl = document.getElementById('time');
        const levelEl = document.getElementById('level');
        const nextCanvas = document.getElementById("next");
        const nextCtx = nextCanvas.getContext("2d");
        const pauseBtn = document.getElementById("pauseBtn");
        const devModeEl = document.getElementById("devMode");
        const highScoreEl = document.getElementById("highScore");
        const highScoreTimeEl = document.getElementById("highScoreTime");
        const highScoreLinesEl = document.getElementById("highScoreLines");
        const highScoreLevelEl = document.getElementById("highScoreLevel");

        // =========================
        // PAUSE
        // =========================

        function togglePause() {
            if (gameOver) return;

            paused = !paused;

            if (paused) {
                pausedAt = Date.now();
                pauseBtn.textContent = "RESUME";
                pauseBtn.blur();
            } else {
                if (pausedAt !== null) {
                    startTime += Date.now() - pausedAt;
                }

                pausedAt = null;
                pauseBtn.textContent = "PAUSE";

                // prevent a giant delta after resuming
                lastTime = performance.now();
            }
        }

        pauseBtn.addEventListener("click", togglePause);

        // automatically pause when the tab/window loses focus.
        // it does NOT automatically resume when focus comes back.
        document.addEventListener("visibilitychange", () => {
            if (document.hidden && !paused && !gameOver) {
                togglePause();
            }
        });

        window.addEventListener("blur", () => {
            if (!paused && !gameOver) {
                togglePause();
            }
        });

        // =========================
        // DEATH
        // =========================

        let deathAnimation = false;
        let deathProgress = 0;
        let deathParticles = [];
        let shake = 0;
        let highScoreDeathAnimation = false;

        // =========================
        // TGM3 RANDOMIZER
        // =========================

        function* tgm3Randomizer() {
            const pieces = ["I", "J", "L", "O", "S", "T", "Z"];

            const pool = [
                ...pieces,
                ...pieces,
                ...pieces,
                ...pieces,
                ...pieces
            ];

            const firstPiece =
                ["I", "J", "L", "T"][
                Math.floor(Math.random() * 4)
                ];

            yield firstPiece;

            const history = ["S", "Z", "S", firstPiece];

            const order = [];

            while (true) {
                let piece;
                let index;

                for (let roll = 0; roll < 6; roll++) {
                    index = Math.floor(Math.random() * 35);
                    piece = pool[index];

                    if (!history.includes(piece) || roll === 5) {
                        break;
                    }

                    if (order.length) {
                        pool[index] = order[0];
                    }
                }

                const oldIndex = order.indexOf(piece);

                if (oldIndex !== -1) {
                    order.splice(oldIndex, 1);
                }

                order.push(piece);

                pool[index] = order[0];

                history.shift();
                history[3] = piece;

                yield piece;
            }
        }

        let tgm3 = tgm3Randomizer();

        let semicolonHeld = false;
        let twoByTwoMode = false;

        function randomPiece() {
            if (twoByTwoMode) {
                return createPiece("I");
            }

            return createPiece(tgm3.next().value);
        }

        let nextPiece = randomPiece();

        // =========================
        // SOUND EFFECTS
        // =========================

        const SFX_PATH = "./sfx/";

        const line0Mode = Math.random() < 0.1;

        const SFX = line0Mode
            ? {
                drop: ["line0.wav"],
                place: ["line0.wav"],
                lineClear: ["line0.wav"],
                explode: ["line0.wav"],
                gameOver: ["line0.wav"],
                clear: ["line0.wav"],
                tetris: ["line0.wav"]
            }
            : {
                drop: ["drop.wav"],
                place: ["place.wav"],

                lineClear: [
                    "line1.wav",
                    "line2.wav",
                    "line3.wav",
                    "line4.wav"
                ],

                explode: [
                    "explode1.wav",
                    "explode2.wav",
                    "explode3.wav",
                    "explode4.wav"
                ],

                gameOver: ["game_over.wav"],
                clear: ["score.wav"],
                tetris: ["tetris.wav"]
            };

        const lastSFX = {};

        function playSFX(type, volume = 1) {
            const sounds = SFX[type];

            if (!sounds || sounds.length === 0) return;

            let index;

            do {
                index = Math.floor(Math.random() * sounds.length);
            } while (
                sounds.length > 1 &&
                index === lastSFX[type]
            );

            lastSFX[type] = index;

            const audio = new Audio(
                SFX_PATH + sounds[index]
            );

            audio.volume = Math.max(
                0,
                Math.min(1, volume)
            );

            audio.play().catch(() => { });
        }

        // =========================
        // NEXT PIECE
        // =========================

        let nextAnim = 1;
        let nextOutAnim = 0;
        let nextAnimatingOut = false;

        function createMatrix(w, h) {
            const m = [];

            while (h--) {
                m.push(new Array(w).fill(0));
            }

            return m;
        }

        function drawBlockToContext(ctx, x, y, size, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x, y, size, size);

            ctx.strokeStyle = "rgba(255,255,255,0.2)";
            ctx.lineWidth = 2;

            ctx.beginPath();
            ctx.moveTo(x + 1, y + size - 1);
            ctx.lineTo(x + 1, y + 1);
            ctx.lineTo(x + size - 1, y + 1);
            ctx.stroke();

            ctx.strokeStyle = "rgba(0,0,0,0.2)";

            ctx.beginPath();
            ctx.moveTo(x + size - 1, y + 1);
            ctx.lineTo(x + size - 1, y + size - 1);
            ctx.lineTo(x + 1, y + size - 1);
            ctx.stroke();

            ctx.fillStyle = "rgba(255,255,255,0.08)";
            ctx.fillRect(
                x + 3,
                y + 3,
                size - 6,
                size - 6
            );
        }

        function trimPiece(matrix) {
            let minX = matrix[0].length;
            let maxX = 0;
            let minY = matrix.length;
            let maxY = 0;

            matrix.forEach((row, y) => {
                row.forEach((v, x) => {
                    if (v) {
                        minX = Math.min(minX, x);
                        maxX = Math.max(maxX, x);
                        minY = Math.min(minY, y);
                        maxY = Math.max(maxY, y);
                    }
                });
            });

            return matrix
                .slice(minY, maxY + 1)
                .map(row =>
                    row.slice(minX, maxX + 1)
                );
        }

        function drawNextPiece() {
            nextCtx.clearRect(
                0,
                0,
                nextCanvas.width,
                nextCanvas.height
            );

            if (nextAnimatingOut) {
                nextOutAnim += 0.15;

                if (nextOutAnim >= 1) {
                    nextAnimatingOut = false;
                    nextOutAnim = 0;
                    nextAnim = 0;
                }
            }

            nextAnim += (1 - nextAnim) * 0.18;

            const piece = trimPiece(nextPiece);

            const size = 24;

            const w = piece[0].length;
            const h = piece.length;

            const offsetX =
                (nextCanvas.width - w * size) / 2;

            const offsetY =
                (nextCanvas.height - h * size) / 2;

            nextCtx.save();

            let scale;
            let alpha;

            if (nextAnimatingOut) {
                scale = 1 - nextOutAnim * 0.4;
                alpha = 1 - nextOutAnim;
            } else {
                scale = 0.8 + nextAnim * 0.2;
                alpha = nextAnim;
            }

            nextCtx.translate(
                nextCanvas.width / 2,
                nextCanvas.height / 2
            );

            nextCtx.scale(scale, scale);

            nextCtx.translate(
                -nextCanvas.width / 2,
                -nextCanvas.height / 2
            );

            nextCtx.globalAlpha = alpha;

            piece.forEach((row, y) => {
                row.forEach((v, x) => {
                    if (!v) return;

                    drawBlockToContext(
                        nextCtx,
                        offsetX + x * size,
                        offsetY + y * size,
                        size,
                        COLORS[v]
                    );
                });
            });

            nextCtx.restore();
        }

        // =========================
        // COLLISION / PIECES
        // =========================

        function collide(arena, player) {
            const [m, o] = [
                player.matrix,
                player.pos
            ];

            for (let y = 0; y < m.length; y++) {
                for (let x = 0; x < m[y].length; x++) {

                    if (
                        m[y][x] &&
                        (
                            arena[y + o.y] &&
                            arena[y + o.y][x + o.x]
                        ) !== 0
                    ) {
                        return true;
                    }
                }
            }

            return false;
        }

        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value) {
                        arena[
                            y + player.pos.y
                        ][
                            x + player.pos.x
                        ] = value;
                    }
                });
            });
        }

        function rotate(matrix, dir) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [
                        matrix[x][y],
                        matrix[y][x]
                    ] = [
                            matrix[y][x],
                            matrix[x][y]
                        ];
                }
            }

            if (dir > 0) {
                matrix.forEach(r => r.reverse());
            } else {
                matrix.reverse();
            }
        }

        function createPiece(type) {
            switch (type) {
                case 'T':
                    return [
                        [0, 1, 0],
                        [1, 1, 1],
                        [0, 0, 0]
                    ];

                case 'O':
                    return [
                        [2, 2],
                        [2, 2]
                    ];

                case 'L':
                    return [
                        [0, 0, 3],
                        [3, 3, 3],
                        [0, 0, 0]
                    ];

                case 'J':
                    return [
                        [4, 0, 0],
                        [4, 4, 4],
                        [0, 0, 0]
                    ];

                case 'I':
                    return [
                        [0, 5, 0, 0],
                        [0, 5, 0, 0],
                        [0, 5, 0, 0],
                        [0, 5, 0, 0]
                    ];

                case 'S':
                    return [
                        [0, 6, 6],
                        [6, 6, 0],
                        [0, 0, 0]
                    ];

                case 'Z':
                    return [
                        [7, 7, 0],
                        [0, 7, 7],
                        [0, 0, 0]
                    ];
            }
        }

        const arena = createMatrix(COLS, ROWS);

        const player = {
            pos: {
                x: 0,
                y: 0
            },

            matrix: null,

            easingPos: {
                x: 0,
                y: 0
            },

            ghostY: 0,
            easingGhostY: 0,

            hardDropTargetY: null,

            ghostOpacity: 0,
            ghostScale: 0.5,
            ghostSpawnTime: 0,
            ghostAnimating: false
        };

        // =========================
        // PLACEMENT FLASH
        // =========================

        let placementFlashCells = [];
        let placementFlashStart = 0;

        const PLACEMENT_FLASH_DURATION = 110;

        function startPlacementFlash() {
            placementFlashCells = [];

            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (!value) return;

                    placementFlashCells.push({
                        x: x + Math.round(player.pos.x),
                        y: y + Math.round(player.pos.y)
                    });
                });
            });

            placementFlashStart = performance.now();
        }

        function drawPlacementFlash() {
            if (!placementFlashCells.length) return;

            const elapsed =
                performance.now() - placementFlashStart;

            if (elapsed >= PLACEMENT_FLASH_DURATION) {
                placementFlashCells = [];
                return;
            }

            const progress =
                elapsed / PLACEMENT_FLASH_DURATION;

            // starts bright and quickly fades
            const alpha =
                Math.pow(1 - progress, 2);

            ctx.save();

            ctx.fillStyle =
                `rgba(255,255,255,${alpha})`;

            placementFlashCells.forEach(cell => {
                if (
                    cell.x < 0 ||
                    cell.x >= COLS ||
                    cell.y < 0 ||
                    cell.y >= ROWS
                ) {
                    return;
                }

                ctx.fillRect(
                    cell.x * BLOCK,
                    cell.y * BLOCK,
                    BLOCK,
                    BLOCK
                );
            });

            ctx.restore();
        }

        function drawBlock(x, y, color) {
            const px = x * BLOCK;
            const py = y * BLOCK;

            ctx.fillStyle = color;
            ctx.fillRect(
                px,
                py,
                BLOCK,
                BLOCK
            );

            ctx.strokeStyle =
                "rgba(255,255,255,0.2)";

            ctx.lineWidth = 2;

            ctx.beginPath();
            ctx.moveTo(
                px + 1,
                py + BLOCK - 1
            );
            ctx.lineTo(
                px + 1,
                py + 1
            );
            ctx.lineTo(
                px + BLOCK - 1,
                py + 1
            );
            ctx.stroke();

            ctx.strokeStyle =
                "rgba(0,0,0,0.2)";

            ctx.beginPath();
            ctx.moveTo(
                px + BLOCK - 1,
                py + 1
            );
            ctx.lineTo(
                px + BLOCK - 1,
                py + BLOCK - 1
            );
            ctx.lineTo(
                px + 1,
                py + BLOCK - 1
            );
            ctx.stroke();

            ctx.fillStyle =
                "rgba(255,255,255,.08)";

            ctx.fillRect(
                px + 4,
                py + 4,
                BLOCK - 8,
                BLOCK - 8
            );
        }

        function drawMatrix(matrix, offset) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (!value) return;

                    drawBlock(
                        x + offset.x,
                        y + offset.y,
                        COLORS[value]
                    );

                    if (
                        clearingRows.includes(
                            y + offset.y
                        )
                    ) {
                        const flash =
                            Math.sin(
                                performance.now() * 0.06
                            ) * 0.5 + 0.5;

                        ctx.fillStyle =
                            `rgba(255,255,255,${flash})`;

                        ctx.fillRect(
                            (x + offset.x) * BLOCK,
                            (y + offset.y) * BLOCK,
                            BLOCK,
                            BLOCK
                        );
                    }
                });
            });
        }

        // =========================
        // GRID
        // =========================

        function drawGrid() {
            ctx.strokeStyle =
                'rgba(255,255,255,0.05)';

            ctx.lineWidth = 1;

            for (let x = 0; x <= COLS; x++) {
                ctx.beginPath();
                ctx.moveTo(
                    x * BLOCK,
                    0
                );
                ctx.lineTo(
                    x * BLOCK,
                    ROWS * BLOCK
                );
                ctx.stroke();
            }

            for (let y = 0; y <= ROWS; y++) {
                ctx.beginPath();
                ctx.moveTo(
                    0,
                    y * BLOCK
                );
                ctx.lineTo(
                    COLS * BLOCK,
                    y * BLOCK
                );
                ctx.stroke();
            }
        }

        // =========================
        // LEVEL-UP BORDER SHINE
        // =========================

        function drawLevelUpShine(delta) {
            if (levelUpShine <= 0) {
                return;
            }

            // fade the animation over time
            levelUpShine -=
                delta / LEVEL_UP_SHINE_DURATION;

            levelUpShine =
                Math.max(0, levelUpShine);

            const progress =
                1 - levelUpShine;

            /*
                The shine travels diagonally from
                top-left -> bottom-right.
        
                The gradient is deliberately wider
                than the border so it looks like a
                moving green reflection rather than
                just a glowing line.
            */

            const shineSize = canvas.width + canvas.height;

            const shineX =
                -canvas.height +
                progress * shineSize;

            ctx.save();

            // only draw around the outside edge
            ctx.lineWidth = 8;

            const gradient =
                ctx.createLinearGradient(
                    shineX - 100,
                    0,
                    shineX + 100,
                    0
                );

            gradient.addColorStop(
                0,
                "rgba(0,255,100,0)"
            );

            gradient.addColorStop(
                0.45,
                `rgba(80,255,140,${levelUpShine * 0.9})`
            );

            gradient.addColorStop(
                0.5,
                `rgba(220,255,230,${levelUpShine})`
            );

            gradient.addColorStop(
                0.55,
                `rgba(80,255,140,${levelUpShine * 0.9})`
            );

            gradient.addColorStop(
                1,
                "rgba(0,255,100,0)"
            );

            ctx.strokeStyle = gradient;

            ctx.strokeRect(
                2,
                2,
                canvas.width - 4,
                canvas.height - 4
            );

            ctx.restore();
        }

        // =========================
        // PARTICLES
        // =========================

        let particles = [];

        function updateParticles() {
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.2;
                p.alpha -= 0.04;
            });

            particles =
                particles.filter(
                    p => p.alpha > 0
                );

            particles.forEach(p => {
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;

                ctx.fillRect(
                    p.x - 3,
                    p.y - 3,
                    6,
                    6
                );

                ctx.globalAlpha = 1;
            });
        }

        function spawnParticles(y) {
            if (
                y < 0 ||
                y >= ROWS
            ) return;

            for (let x = 0; x < COLS; x++) {

                if (arena[y][x] !== 0) {

                    for (let i = 0; i < 20; i++) {

                        particles.push({
                            x:
                                x * BLOCK +
                                BLOCK / 2,

                            y:
                                y * BLOCK +
                                BLOCK / 2,

                            vx:
                                (Math.random() - 0.5) * 16,

                            vy:
                                (Math.random() - 0.5) * 14,

                            alpha: 1,

                            color:
                                COLORS[arena[y][x]]
                        });
                    }
                }
            }
        }

        // =========================
        // LINE CLEAR
        // =========================

        let clearingRows = [];
        let clearQueue = [];
        let clearTimer = 0;

        const CLEAR_DELAY = 55;

        let lastClearedRow = null;
        let pendingClearCount = 0;

        function sweep() {
            if (
                clearingRows.length ||
                clearQueue.length
            ) {
                return;
            }

            const rows = [];

            for (
                let y = arena.length - 1;
                y >= 0;
                y--
            ) {
                if (
                    arena[y].every(
                        v => v !== 0
                    )
                ) {
                    rows.push(y);
                }
            }

            if (!rows.length) return;

            pendingClearCount =
                rows.length;

            clearQueue = [...rows];

            clearNextRow();
        }

        function clearNextRow() {

            let row = -1;

            for (
                let y = arena.length - 1;
                y >= 0;
                y--
            ) {
                if (
                    arena[y].every(
                        v => v !== 0
                    )
                ) {
                    row = y;
                    break;
                }
            }

            if (row === -1) {
                finishLineClear();
                return;
            }

            lastClearedRow = row;
            clearingRows = [row];

            clearTimer = CLEAR_DELAY;

            shake = 5;

            // this sound happens once per individual
            // row animation, as before
            playSFX(
                "lineClear",
                0.8
            );

            spawnParticles(row);

            canvas.animate(
                [
                    { transform: "scale(1)" },
                    { transform: "scale(1.025)" },
                    { transform: "scale(1)" }
                ],
                {
                    duration: CLEAR_DELAY,
                    easing: "ease-out"
                }
            );
        }

        function updateLineClear() {
            if (!clearingRows.length) {
                return;
            }

            clearTimer -= 16.67;

            if (clearTimer > 0) {
                return;
            }

            const row =
                lastClearedRow;

            arena.splice(
                row,
                1
            );

            arena.unshift(
                new Array(COLS).fill(0)
            );

            clearingRows = [];
            lastClearedRow = null;

            setTimeout(() => {
                clearNextRow();
            }, 15);
        }

        function finishLineClear() {
            const totalCleared =
                pendingClearCount;

            if (totalCleared <= 0) {
                resetPlayer();
                return;
            }

            // four lines at once = TETRIS!
            if (totalCleared === 4) {
                playSFX("tetris", 0.9);
            }

            linesCleared += totalCleared;

            // level increases every 10 lines.
            // e.g. 0-9 = level 0,
            //      10-19 = level 1,
            //      20-29 = level 2
            const oldLevel = level;

            level =
                Math.floor(
                    linesCleared / 10
                );

            // level-up effects
            if (level > oldLevel) {
                setTimeout(playSFX("clear", 1.0), 500);

                // start the green border shine
                levelUpShine = 1;
            }

            const lineScore =
                [
                    0,
                    100,
                    300,
                    500,
                    800
                ][
                Math.min(
                    totalCleared,
                    4
                )
                ];

            score +=
                lineScore *
                (level + 1);

            pendingClearCount = 0;
            lastClearedRow = null;

            clearingRows = [];
            clearQueue = [];

            resetPlayer();
        }

        // =========================
        // PLAYER DROP
        // =========================

        function playerDrop() {
            if (
                gameOver ||
                paused ||
                player.hardDropTargetY !== null ||
                clearingRows.length ||
                clearQueue.length
            ) {
                return;
            }

            player.pos.y++;

            if (
                collide(
                    arena,
                    player
                )
            ) {
                player.pos.y--;

                // flash BEFORE the piece becomes
                // part of the board
                startPlacementFlash();

                merge(
                    arena,
                    player
                );

                sweep();

                if (
                    !clearingRows.length &&
                    !clearQueue.length
                ) {
                    playSFX(
                        "place",
                        0.65
                    );

                    resetPlayer();
                }
            }

            gravityTimer = 0;
        }

        // =========================
        // HARD DROP
        // =========================

        function hardDrop() {
            if (
                gameOver ||
                paused ||
                player.hardDropTargetY !== null ||
                clearingRows.length ||
                clearQueue.length
            ) {
                return;
            }

            updateGhostY();

            player.hardDropTargetY =
                player.ghostY;

            player.easingGhostY =
                player.ghostY;

            playSFX(
                "drop",
                0.7
            );
        }

        function animateHardDrop() {
            if (
                player.hardDropTargetY === null
            ) {
                return false;
            }

            const dy =
                player.hardDropTargetY -
                player.pos.y;

            if (
                Math.abs(dy) < 0.05
            ) {
                player.pos.y =
                    player.hardDropTargetY;

                // flash at the final landing position
                startPlacementFlash();

                merge(
                    arena,
                    player
                );

                sweep();

                if (!clearingRows.length) {
                    playSFX(
                        "place",
                        0.65
                    );

                    resetPlayer();
                }

                player.hardDropTargetY = null;

                return false;
            }

            player.pos.y +=
                dy * 0.3;

            return true;
        }

        // =========================
        // MOVEMENT
        // =========================

        function playerMove(dir) {
            player.pos.x += dir;

            if (
                collide(
                    arena,
                    player
                )
            ) {
                player.pos.x -= dir;
            }
        }

        function playerRotate(dir) {
            const oldMatrix =
                player.matrix.map(
                    r => [...r]
                );

            rotate(
                player.matrix,
                dir
            );

            if (
                collide(
                    arena,
                    player
                )
            ) {
                player.matrix =
                    oldMatrix;
            }
        }

        // =========================
        // RESET PLAYER
        // =========================

        function resetPlayer() {
            player.matrix =
                nextPiece;

            nextAnimatingOut = true;
            nextOutAnim = 0;

            setTimeout(() => {
                nextPiece =
                    randomPiece();
            }, 120);

            player.pos.y = 0;

            player.pos.x =
                Math.floor(
                    COLS / 2
                ) -
                Math.floor(
                    player.matrix[0].length / 2
                );

            player.easingPos = {
                ...player.pos
            };

            updateGhostY();

            player.easingGhostY =
                player.ghostY;

            player.ghostOpacity = 0;
            player.ghostScale = 0.5;
            player.ghostSpawnTime =
                performance.now();

            player.ghostAnimating = true;

            checkDeath();
        }

        function updateGhostY() {
            let gy =
                player.pos.y;

            while (
                !collide(
                    arena,
                    {
                        ...player,
                        pos: {
                            x: player.pos.x,
                            y: gy + 1
                        }
                    }
                )
            ) {
                gy++;
            }

            player.ghostY = gy;
        }

        // =========================
        // GHOST
        // =========================

        function drawGhost() {

            if (
                player.hardDropTargetY === null
            ) {
                player.easingGhostY +=
                    (
                        player.ghostY -
                        player.easingGhostY
                    ) * 0.2;
            }

            if (player.ghostAnimating) {

                const elapsed =
                    performance.now() -
                    player.ghostSpawnTime;

                const t =
                    Math.min(
                        elapsed / 100,
                        1
                    );

                const ease =
                    1 -
                    Math.pow(
                        1 - t,
                        3
                    );

                player.ghostScale =
                    0.8 +
                    ease * 0.2;

                player.ghostOpacity =
                    ease * 0.2;

                if (t >= 1) {
                    player.ghostAnimating = false;
                    player.ghostScale = 1;
                    player.ghostOpacity = 0.2;
                }

            } else {

                player.ghostOpacity +=
                    (
                        0.2 -
                        player.ghostOpacity
                    ) * 0.12;
            }

            ctx.save();

            const centerX =
                (
                    player.easingPos.x +
                    player.matrix[0].length / 2
                ) * BLOCK;

            const centerY =
                (
                    player.easingGhostY +
                    player.matrix.length / 2
                ) * BLOCK;

            ctx.translate(
                centerX,
                centerY
            );

            ctx.scale(
                player.ghostScale,
                player.ghostScale
            );

            ctx.translate(
                -centerX,
                -centerY
            );

            ctx.globalAlpha =
                player.ghostOpacity;

            drawMatrix(
                player.matrix,
                {
                    x: player.easingPos.x,
                    y: player.easingGhostY
                }
            );

            ctx.restore();

            ctx.globalAlpha = 1;
        }

        // =========================
        // DEATH
        // =========================

        function checkDeath() {
            if (
                collide(
                    arena,
                    player
                )
            ) {
                gameOver = true;
                deathAnimation = true;
                highScoreDeathAnimation = newHighScoreThisGame;

                playSFX(
                    "gameOver",
                    0.9
                );

                playSFX(
                    "explode",
                    0.8
                );

                shake = 20;

                for (
                    let y = 0;
                    y < ROWS;
                    y++
                ) {
                    for (
                        let x = 0;
                        x < COLS;
                        x++
                    ) {
                        if (arena[y][x]) {

                            for (
                                let i = 0;
                                i < 10;
                                i++
                            ) {
                                deathParticles.push({
                                    x:
                                        x * BLOCK +
                                        BLOCK / 2,

                                    y:
                                        y * BLOCK +
                                        BLOCK / 2,

                                    vx:
                                        (Math.random() - 0.5) * 14,

                                    vy:
                                        (Math.random() - 0.5) * 14,

                                    rot:
                                        Math.random() *
                                        Math.PI * 2,

                                    vr:
                                        (Math.random() - 0.5) *
                                        0.4,

                                    size:
                                        BLOCK * 0.7,

                                    alpha: 1,

                                    color:
                                        COLORS[
                                        arena[y][x]
                                        ]
                                });
                            }
                        }
                    }
                }
            }
        }

        function updateDeathAnimation() {

            deathProgress +=
                0.015;

            ctx.fillStyle =
                "rgba(0,0,0,0.08)";

            ctx.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            deathParticles.forEach(p => {

                p.x += p.vx;
                p.y += p.vy;

                p.vy += 0.35;
                p.vx *= 0.985;

                p.rot += p.vr;
                p.alpha -= 0.012;

                ctx.save();

                ctx.translate(
                    p.x,
                    p.y
                );

                ctx.rotate(
                    p.rot
                );

                ctx.globalAlpha =
                    Math.max(
                        0,
                        p.alpha
                    );

                ctx.fillStyle =
                    p.color;

                ctx.fillRect(
                    -p.size / 2,
                    -p.size / 2,
                    p.size,
                    p.size
                );

                ctx.restore();

                ctx.globalAlpha = 1;
            });

            deathParticles =
                deathParticles.filter(
                    p => p.alpha > 0
                );

            ctx.fillStyle =
                `rgba(0,0,0,${Math.min(
                    deathProgress * 0.6,
                    0.6
                )})`;

            ctx.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            const scale =
                1 +
                Math.sin(
                    deathProgress * 8
                ) * 0.05;

            ctx.save();

            ctx.translate(
                canvas.width / 2,
                canvas.height / 2
            );

            ctx.scale(
                scale,
                scale
            );

            ctx.textAlign =
                "center";

            ctx.fillStyle =
                "#fff";

            ctx.font =
                "72px 'Micro 5'";

            ctx.fillText(
                "GAME",
                0,
                -25
            );

            ctx.fillText(
                "OVER",
                0,
                45
            );

            ctx.font =
                "28px 'Micro 5'";

            ctx.fillText(
                "PRESS SPACE TO RESTART",
                0,
                95
            );

            ctx.restore();

            if (highScoreDeathAnimation) {
                const t = Math.min(deathProgress / 1.2, 1);

                const pop =
                    1 - Math.pow(1 - t, 3);

                const pulse =
                    1 +
                    Math.sin(deathProgress * 18) * 0.045;

                ctx.save();

                ctx.translate(
                    canvas.width / 2,
                    canvas.height / 2 - 115
                );

                ctx.scale(
                    (0.65 + pop * 0.35) * pulse,
                    (0.65 + pop * 0.35) * pulse
                );

                ctx.textAlign = "center";
                ctx.textBaseline = "middle";

                // dark backing
                ctx.fillStyle = "rgba(0,0,0,0.65)";
                ctx.fillRect(
                    -125,
                    -31,
                    250,
                    62
                );

                // outline
                ctx.strokeStyle =
                    "rgba(255,255,255,0.9)";

                ctx.lineWidth = 3;

                ctx.strokeRect(
                    -125,
                    -31,
                    250,
                    62
                );

                // text
                ctx.fillStyle = "#fff";

                ctx.font =
                    "42px 'Micro 5'";

                ctx.fillText(
                    "NEW HIGH SCORE!",
                    0,
                    0
                );

                ctx.restore();
            }
        }

        // =========================
        // UI
        // =========================

        function updateUI() {
            scoreEl.textContent =
                score;

            linesEl.textContent =
                linesCleared;

            levelEl.textContent =
                level;

            const hsMinutes = String(
                Math.floor(highScoreData.time / 60)
            ).padStart(2, "0");

            const hsSeconds = String(
                highScoreData.time % 60
            ).padStart(2, "0");

            highScoreTimeEl.textContent =
                `${hsMinutes}:${hsSeconds}`;

            highScoreLinesEl.textContent =
                highScoreData.lines;

            highScoreLevelEl.textContent =
                highScoreData.level;

            let elapsed;

            // dev mode scores are NEVER saved
            if (!twoByTwoMode && score > highScore) {
                const currentTime = Math.floor(
                    (
                        (paused && pausedAt !== null
                            ? pausedAt
                            : Date.now()) -
                        startTime
                    ) / 1000
                );

                highScore = score;
                newHighScoreThisGame = true;

                highScoreData = {
                    score: score,
                    time: currentTime,
                    lines: linesCleared,
                    level: level
                };

                localStorage.setItem(
                    "tetrisHighScoreData",
                    JSON.stringify(highScoreData)
                );
            }

            highScoreEl.textContent = highScore;

            if (paused && pausedAt !== null) {
                elapsed =
                    Math.floor(
                        (
                            pausedAt -
                            startTime
                        ) / 1000
                    );
            } else {
                elapsed =
                    Math.floor(
                        (
                            Date.now() -
                            startTime
                        ) / 1000
                    );
            }

            const m =
                String(
                    Math.floor(
                        elapsed / 60
                    )
                ).padStart(2, '0');

            const s =
                String(
                    elapsed % 60
                ).padStart(2, '0');

            timeEl.textContent =
                `${m}:${s}`;

            devModeEl.classList.toggle(
                "active",
                twoByTwoMode
            );

            drawNextPiece();
        }

        // =========================
        // GRAVITY
        // =========================

        function getGravitySpeed() {
            // each level is 10 lines.
            //
            // level 0 = 800ms
            // level 1 = 656ms
            // level 2 = 538ms
            // level 3 = 441ms
            // ...
            //
            // eventually bottoms out at 50ms.

            return Math.max(
                MAX_GRAVITY,
                START_GRAVITY *
                Math.pow(
                    0.82,
                    level
                )
            );
        }

        // =========================
        // MAIN LOOP
        // =========================

        let lastTime = 0;

        function update(time = 0) {

            const delta =
                Math.min(
                    time - lastTime,
                    100
                );

            lastTime = time;

            ctx.save();

            if (shake > 0) {

                canvas.style.transform =
                    `translate(
            ${(Math.random() - 0.5) * shake}px,
            ${(Math.random() - 0.5) * shake}px
          )`;

                shake *= 0.92;

            } else {
                canvas.style.transform = "";
            }

            // =========================
            // GAME OVER
            // =========================

            if (
                gameOver &&
                deathAnimation
            ) {

                ctx.clearRect(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );

                drawGrid();

                drawMatrix(
                    arena,
                    {
                        x: 0,
                        y: 0
                    }
                );

                updateDeathAnimation();

                ctx.restore();

                requestAnimationFrame(
                    update
                );

                return;
            }

            // =========================
            // PAUSED
            // =========================

            if (paused) {

                ctx.clearRect(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );

                drawGrid();

                drawMatrix(
                    arena,
                    {
                        x: 0,
                        y: 0
                    }
                );

                drawMatrix(
                    player.matrix,
                    player.easingPos
                );

                drawPlacementFlash();

                ctx.save();

                ctx.fillStyle =
                    "rgba(0,0,0,0.65)";

                ctx.fillRect(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );

                ctx.textAlign =
                    "center";

                ctx.textBaseline =
                    "middle";

                ctx.fillStyle =
                    "#fff";

                ctx.font =
                    "64px 'Micro 5'";

                ctx.fillText(
                    "PAUSED",
                    canvas.width / 2,
                    canvas.height / 2
                );

                ctx.font =
                    "28px 'Micro 5'";

                ctx.fillText(
                    "PRESS P TO RESUME",
                    canvas.width / 2,
                    canvas.height / 2 + 55
                );

                ctx.restore();

                updateUI();

                ctx.restore();

                requestAnimationFrame(
                    update
                );

                return;
            }

            // =========================
            // NORMAL GAME
            // =========================

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            drawGrid();

            // level-up green border shine
            drawLevelUpShine(delta);

            // gravity
            if (
                !clearingRows.length &&
                !clearQueue.length &&
                player.hardDropTargetY === null
            ) {

                gravityTimer += delta;

                const gravity =
                    getGravitySpeed();

                if (
                    gravityTimer >= gravity
                ) {
                    playerDrop();
                    gravityTimer = 0;
                }
            }

            // smooth movement
            player.easingPos.x +=
                (
                    player.pos.x -
                    player.easingPos.x
                ) * 0.2;

            player.easingPos.y +=
                (
                    player.pos.y -
                    player.easingPos.y
                ) * 0.2;

            if (
                player.hardDropTargetY === null &&
                !clearingRows.length &&
                !clearQueue.length
            ) {
                updateGhostY();
            }

            drawGhost();

            drawMatrix(
                arena,
                {
                    x: 0,
                    y: 0
                }
            );

            drawMatrix(
                player.matrix,
                player.easingPos
            );

            // placement flash is drawn on top
            // of the placed blocks
            drawPlacementFlash();

            updateParticles();

            updateLineClear();

            if (
                !clearingRows.length &&
                !clearQueue.length
            ) {
                animateHardDrop();
            }

            updateUI();

            ctx.restore();

            requestAnimationFrame(
                update
            );
        }

        // =========================
        // RESTART
        // =========================

        function restartGame() {

            // holding ; while restarting enables
            // I-only dev mode
            twoByTwoMode =
                semicolonHeld;

            for (
                let y = 0;
                y < ROWS;
                y++
            ) {
                arena[y].fill(0);
            }

            score = 0;
            linesCleared = 0;
            level = 0;

            gameOver = false;
            paused = false;
            pausedAt = null;

            deathAnimation = false;
            deathProgress = 0;
            deathParticles = [];
            highScoreDeathAnimation = false;
            newHighScoreThisGame = false;

            particles = [];

            placementFlashCells = [];

            clearingRows = [];
            clearQueue = [];

            clearTimer = 0;
            pendingClearCount = 0;
            lastClearedRow = null;

            gravityTimer = 0;

            player.hardDropTargetY = null;

            tgm3 =
                tgm3Randomizer();

            nextPiece =
                twoByTwoMode
                    ? createPiece("I")
                    : createPiece(
                        tgm3.next().value
                    );

            pauseBtn.textContent =
                "PAUSE";

            startTime =
                Date.now();

            lastTime =
                performance.now();

            resetPlayer();

            updateUI();
        }

        // =========================
        // INPUT
        // =========================

        document.addEventListener(
            "keydown",
            e => {

                if (
                    e.code === "Semicolon"
                ) {
                    semicolonHeld = true;
                }

                if (gameOver) {

                    if (
                        e.code === "Space"
                    ) {
                        restartGame();
                    }

                    return;
                }

                if (
                    e.key.toLowerCase() === "p"
                ) {
                    togglePause();
                    return;
                }

                if (paused) return;

                if (
                    e.key === "ArrowLeft"
                ) {
                    playerMove(-1);
                }

                if (
                    e.key === "ArrowRight"
                ) {
                    playerMove(1);
                }

                if (
                    e.key === "ArrowDown"
                ) {
                    playerDrop();
                }

                if (
                    e.key === "ArrowUp"
                ) {
                    playerRotate(1);
                }

                if (
                    e.code === "Space"
                ) {
                    hardDrop();
                }
            }
        );

        document.addEventListener(
            "keyup",
            e => {

                if (
                    e.code === "Semicolon"
                ) {
                    semicolonHeld = false;
                }
            }
        );

        // =========================
        // START
        // =========================

        resetPlayer();
        update();
    </script>
</body>
