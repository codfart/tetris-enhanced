<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="img/favicon.ico">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/ui.css">
    <link rel="stylesheet" href="css/settings.css">
</head>

<body>
    <!-- HIGH SCORE UI (left) -->
    <div id="highScoreUI">
        <div class="ui-value" style="margin-bottom: 16px;">HIGH SCORE:</div>

        <div class="ui-line">
            <span class="ui-title">SCORE:</span>
            <div id="highScore" class="ui-value">0</div>
        </div>

        <div class="ui-line">
            <span class="ui-title">TIME:</span>
            <span id="highScoreTime" class="ui-value">00:00</span>
        </div>

        <div class="ui-line">
            <span class="ui-title">LINES:</span>
            <span id="highScoreLines" class="ui-value">0</span>
        </div>

        <div class="ui-line">
            <span class="ui-title">LEVEL:</span>
            <span id="highScoreLevel" class="ui-value">0</span>
        </div>
    </div>

    <!-- MAIN UI (right) -->
    <div id="ui">

        <div style="margin: 16px 0 20px 0">
            <div class="ui-value">NEXT UP:</div>
            <canvas id="next" width="96" height="96"></canvas>
        </div>

        <div id="devMode">DEV: I-ONLY</div>

        <div class="ui-line">
            <span class="ui-title">SCORE:</span>
            <span id="score" class="ui-value">0</span>
        </div>

        <div class="ui-line">
            <span class="ui-title">TIME:</span>
            <span id="time" class="ui-value">00:00</span>
        </div>

        <div class="ui-line">
            <span class="ui-title">LINES:</span>
            <span id="lines" class="ui-value">0</span>
        </div>

        <div class="ui-line">
            <span class="ui-title">LEVEL:</span>
            <span id="level" class="ui-value">0</span>
        </div>

        <button id="pauseBtn">PAUSE</button>
        <button id="optionsBtn">OPTIONS</button>
    </div>

    <!-- OPTIONS MENU -->
    <div id="optionsOverlay">
        <div id="optionsPanel">

            <div id="optionsTitle">OPTIONS</div>

            <!-- GRAPHICS -->
            <div class="settingsCategory">
                <div class="settingsCategoryTitle">
                    <img class="settingsIcon" src="img/settings-graphics.png" draggable="false">
                    GRAPHICS
                </div>

                <div class="option">
                    <label for="particlesToggle">PARTICLES</label>
                    <input type="checkbox" id="particlesToggle">
                </div>

                <div class="option">
                    <label for="animationsToggle">ANIMATIONS</label>
                    <input type="checkbox" id="animationsToggle">
                </div>

                <div class="option sliderOption" id="animationSpeedOption">
                    <label for="animationSpeed">
                        ANIMATION SPEED
                        <span id="animationSpeedValue">1x</span>
                    </label>

                    <input type="range" id="animationSpeed" min="0.5" max="3" step="0.25" value="1">
                </div>

                <div class="option">
                    <label for="shakeToggle">SHAKE EFFECTS</label>
                    <input type="checkbox" id="shakeToggle">
                </div>
            </div>

            <!-- FEATURES -->
            <div class="settingsCategory">
                <div class="settingsCategoryTitle">
                    <img class="settingsIcon" src="img/settings-features.png" draggable="false">
                    FEATURES
                </div>

                <div class="option">
                    <label for="autoRestartToggle">AUTO RESTART</label>
                    <input type="checkbox" id="autoRestartToggle">
                </div>

                <div class="option">
                    <label for="scorePopupToggle">SCORE POPUP</label>
                    <input type="checkbox" id="scorePopupToggle">
                </div>

                <div class="option">
                    <label for="speedUpToggle">SPEED INCREASE ANIMATION</label>
                    <input type="checkbox" id="speedUpToggle">
                </div>

                <div class="option">
                    <label for="disableUpdateToggle">DISABLE UPDATE BUTTON</label>
                    <input type="checkbox" id="disableUpdateToggle">
                </div>
            </div>

            <!-- SOUNDS -->
            <div class="settingsCategory">
                <div class="settingsCategoryTitle">
                    <img class="settingsIcon" src="img/settings-sounds.png" draggable="false">
                    SOUNDS
                </div>

                <div class="option sliderOption disabledOption">
                    <label for="musicVolume">
                        MUSIC VOLUME
                        <span id="musicVolumeValue">0%</span>
                    </label>

                    <input type="range" id="musicVolume" min="0" max="100" step="5" value="0" disabled>
                </div>

                <div class="option sliderOption">
                    <label for="sfxVolume">
                        SFX VOLUME
                        <span id="sfxVolumeValue">100%</span>
                    </label>

                    <input type="range" id="sfxVolume" min="0" max="100" step="5" value="100">
                </div>

                <button id="resetSettingsBtn">RESET SETTINGS</button>
                <button id="closeOptionsBtn">CLOSE</button>
            </div>
        </div>
    </div>

    <!-- GAME WINDOW (middle) -->
    <canvas id="game" width="320" height="640"></canvas>
    <div id="scorePopupContainer"></div>

    <!-- UPDATE BOX -->
    <div class="update disabled">
        <p>UPDATE AVAILABLE!</p>
    </div>

    <!-- GITHUB FAVICON LINK (bottom-right) -->
    <a href="https://github.com/codfart/tetris-enhanced">
        <img src="img/favicon.png" class="favicon" draggable="false">
    </a>

    <!-- GAME SCRIPTS -->
    <script src="js/updater.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/global.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/pieces.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/rendering.js"></script>
    <script src="js/effects.js"></script>
    
    <!-- UNFINISHED GAME SCRIPTS -->
    <script src="js/state.js"></script>
    <script src="js/gameplay.js"></script>
    <script src="js/main.js"></script>

    <script>




        // =========================
        // DEATH
        // =========================

        function checkDeath() {
            if (
                collide(
                    arena,
                    player
                )
            ) {
                gameOver = true;
                deathAnimation = true;
                highScoreDeathAnimation = newHighScoreThisGame;

                playSFX(
                    "gameOver",
                    0.9
                );

                playSFX(
                    "explode",
                    0.8
                );

                shake = 20;

                for (
                    let y = 0;
                    y < ROWS;
                    y++
                ) {
                    for (
                        let x = 0;
                        x < COLS;
                        x++
                    ) {
                        if (arena[y][x]) {

                            for (
                                let i = 0;
                                i < 10;
                                i++
                            ) {
                                if (settings.particles) {
                                    deathParticles.push({
                                        x:
                                            x * BLOCK +
                                            BLOCK / 2,

                                        y:
                                            y * BLOCK +
                                            BLOCK / 2,

                                        vx:
                                            (Math.random() - 0.5) * 14,

                                        vy:
                                            (Math.random() - 0.5) * 14,

                                        rot:
                                            Math.random() *
                                            Math.PI * 2,

                                        vr:
                                            (Math.random() - 0.5) *
                                            0.4,

                                        size:
                                            BLOCK * 0.7,

                                        alpha: 1,

                                        color:
                                            COLORS[
                                            arena[y][x]
                                            ]
                                    });
                                }
                            }
                        }
                    }
                }

                if (settings.autoRestart) {
                    if (gameOver) {
                        restartGame();
                    }
                }
            }
        }

        function updateDeathAnimation(dt) {
            deathProgress += 0.015 * dt;

            ctx.fillStyle =
                "rgba(0,0,0,0.08)";

            ctx.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            deathParticles.forEach(p => {

                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.vy += 0.35 * dt;
                p.vx *= Math.pow(0.985, dt);
                p.rot += p.vr * dt;
                p.alpha -= 0.012 * dt;

                ctx.save();

                ctx.translate(
                    p.x,
                    p.y
                );

                ctx.rotate(
                    p.rot
                );

                ctx.globalAlpha =
                    Math.max(
                        0,
                        p.alpha
                    );

                ctx.fillStyle =
                    p.color;

                ctx.fillRect(
                    -p.size / 2,
                    -p.size / 2,
                    p.size,
                    p.size
                );

                ctx.restore();

                ctx.globalAlpha = 1;
            });

            deathParticles =
                deathParticles.filter(
                    p => p.alpha > 0
                );

            ctx.fillStyle =
                `rgba(0,0,0,${Math.min(
                    deathProgress * 0.6,
                    0.6
                )})`;

            ctx.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            const scale =
                1 +
                Math.sin(
                    deathProgress * 8
                ) * 0.05;

            ctx.save();

            ctx.translate(
                canvas.width / 2,
                canvas.height / 2
            );

            ctx.scale(
                scale,
                scale
            );

            ctx.textAlign =
                "center";

            ctx.fillStyle =
                "#fff";

            ctx.font =
                "72px 'Micro 5'";

            ctx.fillText(
                "GAME",
                0,
                -25
            );

            ctx.fillText(
                "OVER",
                0,
                45
            );

            ctx.font =
                "28px 'Micro 5'";

            ctx.fillText(
                "PRESS SPACE TO RESTART",
                0,
                95
            );

            ctx.restore();

            if (highScoreDeathAnimation) {
                const t = Math.min(deathProgress / 1.2, 1);

                const pop =
                    1 - Math.pow(1 - t, 3);

                const pulse =
                    1 +
                    Math.sin(deathProgress * 18) * 0.045;

                ctx.save();

                ctx.translate(
                    canvas.width / 2,
                    canvas.height / 2 - 115
                );

                ctx.scale(
                    (0.65 + pop * 0.35) * pulse,
                    (0.65 + pop * 0.35) * pulse
                );

                ctx.textAlign = "center";
                ctx.textBaseline = "middle";

                // dark backing
                ctx.fillStyle = "rgba(0,0,0,0.65)";
                ctx.fillRect(
                    -125,
                    -31,
                    250,
                    62
                );

                // outline
                ctx.strokeStyle =
                    "rgba(255,255,255,0.9)";

                ctx.lineWidth = 3;

                ctx.strokeRect(
                    -125,
                    -31,
                    250,
                    62
                );

                // text
                ctx.fillStyle = "#fff";

                ctx.font =
                    "42px 'Micro 5'";

                ctx.fillText(
                    "NEW HIGH SCORE!",
                    0,
                    0
                );

                ctx.restore();
            }
        }



        // =========================
        // GRAVITY
        // =========================

        function getGravitySpeed() {
            // each level is 10 lines.
            //
            // level 0 = 800ms
            // level 1 = 656ms
            // level 2 = 538ms
            // level 3 = 441ms
            // ...
            //
            // eventually bottoms out at 50ms.

            return Math.max(
                MAX_GRAVITY,
                START_GRAVITY *
                Math.pow(
                    0.82,
                    level
                )
            );
        }

        // =========================
        // MAIN LOOP
        // =========================

        let lastTime = 0;

        function update(time = 0) {

            const delta = Math.min(time - lastTime, 100);
            lastTime = time;
            const dt = delta / 16.6667; // 1.0 at 60 FPS

            ctx.save();

            if (settings.shake && shake > 0) {

                canvas.style.transform =
                    `translate(
            ${(Math.random() - 0.5) * shake}px,
            ${(Math.random() - 0.5) * shake}px
          )`;

                shake *= Math.pow(0.92, dt);

            } else {
                canvas.style.transform = "";
            }

            // =========================
            // GAME OVER
            // =========================

            if (
                gameOver &&
                deathAnimation
            ) {

                ctx.clearRect(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );

                drawGrid();

                drawMatrix(
                    arena,
                    {
                        x: 0,
                        y: 0
                    }
                );

                updateDeathAnimation(dt);

                ctx.restore();

                requestAnimationFrame(
                    update
                );

                return;
            }

            // =========================
            // PAUSED
            // =========================

            if (paused) {

                ctx.clearRect(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );

                drawGrid();

                drawMatrix(
                    arena,
                    {
                        x: 0,
                        y: 0
                    }
                );

                drawMatrix(
                    player.matrix,
                    player.easingPos
                );

                drawPlacementFlash();

                ctx.save();

                ctx.fillStyle =
                    "rgba(0,0,0,0.65)";

                ctx.fillRect(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );

                ctx.textAlign =
                    "center";

                ctx.textBaseline =
                    "middle";

                ctx.fillStyle =
                    "#fff";

                ctx.font =
                    "64px 'Micro 5'";

                ctx.fillText(
                    "PAUSED",
                    canvas.width / 2,
                    canvas.height / 2
                );

                ctx.font =
                    "28px 'Micro 5'";

                ctx.fillText(
                    "PRESS P TO RESUME",
                    canvas.width / 2,
                    canvas.height / 2 + 55
                );

                ctx.restore();

                updateUI(dt);

                ctx.restore();

                requestAnimationFrame(
                    update
                );

                return;
            }

            // =========================
            // NORMAL GAME
            // =========================

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            drawGrid();

            // level-up green border shine
            drawLevelUpShine(delta);

            // gravity
            if (
                !clearingRows.length &&
                !clearQueue.length &&
                player.hardDropTargetY === null
            ) {

                gravityTimer += delta;

                const gravity =
                    getGravitySpeed();

                if (
                    gravityTimer >= gravity
                ) {
                    playerDrop();
                    gravityTimer = 0;
                }
            }

            // smooth movement
            const smoothing = settings.animations
                ? 1 - Math.pow(1 - 0.38, dt * settings.animationSpeed)
                : 1;

            player.easingPos.x +=
                (player.pos.x - player.easingPos.x) * smoothing;

            player.easingPos.y +=
                (player.pos.y - player.easingPos.y) * smoothing;

            if (
                player.hardDropTargetY === null &&
                !clearingRows.length &&
                !clearQueue.length
            ) {
                updateGhostY();
            }

            drawGhost(dt);

            drawMatrix(
                arena,
                {
                    x: 0,
                    y: 0
                }
            );

            updateSpawnAnimation();

            ctx.save();

            if (settings.animations) {
                const spawnScale =
                    0.72 +
                    player.spawnProgress * 0.28;

                const spawnAlpha =
                    0.25 +
                    player.spawnProgress * 0.75;

                const centerX =
                    (
                        player.easingPos.x +
                        player.matrix[0].length / 2
                    ) * BLOCK;

                const centerY =
                    (
                        player.easingPos.y +
                        player.matrix.length / 2
                    ) * BLOCK;

                ctx.translate(
                    centerX,
                    centerY
                );

                ctx.scale(
                    spawnScale,
                    spawnScale
                );

                ctx.translate(
                    -centerX,
                    -centerY
                );

                ctx.globalAlpha =
                    spawnAlpha;
            }

            drawMatrix(
                player.matrix,
                player.easingPos
            );

            ctx.restore();

            ctx.globalAlpha = 1;

            // placement flash is drawn on top
            // of the placed blocks
            drawPlacementFlash();

            updateParticles(dt);

            updateLineClear(delta);

            if (
                !clearingRows.length &&
                !clearQueue.length
            ) {
                animateHardDrop(dt);
            }

            updateUI(dt);

            ctx.restore();

            requestAnimationFrame(
                update
            );
        }

        // =========================
        // RESTART
        // =========================

        function restartGame() {
            if (autoRestartTimer !== null) {
                clearTimeout(autoRestartTimer);
                autoRestartTimer = null;
            }

            // holding ; while restarting enables
            // I-only dev mode
            twoByTwoMode =
                semicolonHeld;

            for (
                let y = 0;
                y < ROWS;
                y++
            ) {
                arena[y].fill(0);
            }

            score = 0;
            linesCleared = 0;
            level = 0;

            gameOver = false;
            paused = false;
            pausedAt = null;

            deathAnimation = false;
            deathProgress = 0;
            deathParticles = [];
            highScoreDeathAnimation = false;
            newHighScoreThisGame = false;

            particles = [];

            placementFlashCells = [];

            clearingRows = [];
            clearQueue = [];

            clearTimer = 0;
            pendingClearCount = 0;
            lastClearedRow = null;

            gravityTimer = 0;

            player.hardDropTargetY = null;

            tgm3 =
                tgm3Randomizer();

            nextPiece =
                twoByTwoMode
                    ? createPiece("I")
                    : createPiece(
                        tgm3.next().value
                    );

            pauseBtn.textContent =
                "PAUSE";

            startTime =
                Date.now();

            lastTime =
                performance.now();

            resetPlayer();

            updateUI();
        }

        // =========================
        // INPUT
        // =========================

        document.addEventListener(
            "keydown",
            e => {
                if (e.code === "Space") {
                    e.preventDefault();
                }

                if (
                    e.code === "Semicolon"
                ) {
                    semicolonHeld = true;
                }

                if (gameOver) {

                    if (
                        e.code === "Space"
                    ) {
                        restartGame();
                    }

                    return;
                }

                if (
                    e.key.toLowerCase() === "p"
                ) {
                    togglePause();
                    return;
                }

                if (paused) return;

                if (
                    e.key === "ArrowLeft"
                ) {
                    playerMove(-1);
                }

                if (
                    e.key === "ArrowRight"
                ) {
                    playerMove(1);
                }

                if (
                    e.key === "ArrowDown"
                ) {
                    playerDrop();
                }

                if (
                    e.key === "ArrowUp"
                ) {
                    playerRotate(1);
                }

                if (
                    e.code === "Space"
                ) {
                    hardDrop();
                }
            }
        );

        document.addEventListener(
            "keyup",
            e => {

                if (
                    e.code === "Semicolon"
                ) {
                    semicolonHeld = false;
                }
            }
        );

        // =========================
        // START
        // =========================

        resetPlayer();
        update();
    </script>
</body>

</html>
